<!-- Skip link: first tab stop on every page (WCAG 2.1 AA, PRD §10.3). -->
<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-primary focus:px-4 focus:py-2 focus:text-label-lg focus:text-on-primary"
>
  Skip to main content
</a>

<!-- Global request indicator. aria-hidden because the loading state of each
     screen is already announced by its own state panel. -->
@if (loading.isLoading()) {
  <div class="fixed inset-x-0 top-0 z-[55] h-0.5 overflow-hidden bg-primary-container" aria-hidden="true">
    <div class="h-full w-1/3 bg-primary motion-safe:animate-pulse"></div>
  </div>
}

<main id="main-content" class="min-h-screen bg-surface-container">
  <router-outlet />
</main>

<!-- Mounted once. Features raise feedback through the services, never by placing
     a dialog or toast in their own template. -->
<app-toast-host />
<app-dialog-host />
